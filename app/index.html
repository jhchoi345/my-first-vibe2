<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>모먼트립</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script>
  // DESIGN.md 값 그대로 (docs/DESIGN.md frontmatter)
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          primary: '#8a4fd8', 'on-primary': '#ffffff', 'primary-tint': '#f3edfc', 'primary-strong': '#6a3fb8',
          accent: '#c2367a', 'accent-tint': '#fdebf3', link: '#6a3fb8',
          error: '#c4183c', 'error-tint': '#fdecef', success: '#2b7a3b', 'success-tint': '#e9f6ec',
          ink: '#18181b', canvas: '#f4f4f5', surface: '#ffffff', muted: '#8e8e95', faint: '#aaaab1',
          disabled: '#e4e4e7', 'select-border': '#dee2e5',
        },
        fontFamily: {
          sans: ['"Pretendard Variable"', 'Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', '"Apple SD Gothic Neo"', '"Noto Sans KR"', 'sans-serif'],
        },
        borderRadius: { select: '3px', control: '8px', card: '12px', notice: '16px' },
        fontSize: {
          section: ['24px', { lineHeight: '36px', letterSpacing: '-0.6px', fontWeight: '700' }],
          'card-title': ['16px', { lineHeight: '24.8px', letterSpacing: '-0.32px', fontWeight: '700' }],
          button: ['14px', { lineHeight: '21.7px', letterSpacing: '-0.28px', fontWeight: '700' }],
          body: ['14px', { lineHeight: '1.55' }],
          meta: ['12px', { lineHeight: '19.2px', letterSpacing: '-0.12px' }],
          badge: ['10px', { lineHeight: '16px', letterSpacing: '-0.1px', fontWeight: '700' }],
        },
      },
    },
  };
</script>
<style>
  html, body { background: #f4f4f5; color: #18181b; -webkit-font-smoothing: antialiased; word-break: keep-all; }
  /* DESIGN.md: 채운 버튼은 흰 오버레이, 옅은 버튼은 검은 오버레이, 포커스는 라벤더 링 */
  .btn-primary:hover { background-image: linear-gradient(rgba(255,255,255,.08), rgba(255,255,255,.08)); }
  .btn-primary:active { background-image: linear-gradient(rgba(255,255,255,.16), rgba(255,255,255,.16)); }
  .btn-soft:hover { background-image: linear-gradient(rgba(0,0,0,.04), rgba(0,0,0,.04)); }
  .btn-soft:active { background-image: linear-gradient(rgba(0,0,0,.08), rgba(0,0,0,.08)); }
  :focus-visible { outline: 2px solid #8a4fd8; outline-offset: 2px; }
  @keyframes mt-spin { to { transform: rotate(360deg); } }
  .mt-spin { animation: mt-spin .8s linear infinite; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?external=react",
    "htm": "https://esm.sh/htm@3.1.1",
    "@phosphor-icons/react": "https://esm.sh/@phosphor-icons/react@2.1.7?external=react",
    "exifr": "https://esm.sh/exifr@7.1.3",
    "idb-keyval": "https://esm.sh/idb-keyval@6.2.1"
  }
}
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
