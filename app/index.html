<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>모먼트립</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<!-- claude.ai 페이지에서는 Pretendard 파일을 못 불러와서, 비슷한 Noto Sans KR(Google Fonts)로 대신 보인다 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script>
  // DESIGN.md 값 그대로 (docs/DESIGN.md frontmatter)
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          primary: '#8a4fd8', 'on-primary': '#ffffff', 'primary-tint': '#f3edfc', 'primary-strong': '#6a3fb8',
          accent: '#c2367a', 'accent-tint': '#fdebf3', link: '#6a3fb8',
          error: '#c4183c', 'error-tint': '#fdecef', success: '#2b7a3b', 'success-tint': '#e9f6ec',
          ink: '#18181b', canvas: '#f4f4f5', surface: '#ffffff', muted: '#8e8e95', faint: '#aaaab1',
          disabled: '#e4e4e7', 'select-border': '#dee2e5',
        },
        fontFamily: {
          sans: ['"Pretendard Variable"', 'Pretendard', '"Noto Sans KR"', '-apple-system', 'BlinkMacSystemFont', 'system-ui', '"Apple SD Gothic Neo"', 'sans-serif'],
        },
        borderRadius: { select: '3px', control: '8px', card: '12px', notice: '16px' },
        fontSize: {
          section: ['24px', { lineHeight: '36px', letterSpacing: '-0.6px', fontWeight: '700' }],
          'card-title': ['16px', { lineHeight: '24.8px', letterSpacing: '-0.32px', fontWeight: '700' }],
          button: ['14px', { lineHeight: '21.7px', letterSpacing: '-0.28px', fontWeight: '700' }],
          body: ['14px', { lineHeight: '1.55' }],
          meta: ['12px', { lineHeight: '19.2px', letterSpacing: '-0.12px' }],
          badge: ['10px', { lineHeight: '16px', letterSpacing: '-0.1px', fontWeight: '700' }],
        },
      },
    },
  };
</script>
<style>
  html, body { background: #f4f4f5; color: #18181b; -webkit-font-smoothing: antialiased; word-break: keep-all; }
  /* DESIGN.md: 채운 버튼은 흰 오버레이, 옅은 버튼은 검은 오버레이, 포커스는 라벤더 링 */
  .btn-primary:hover { background-image: linear-gradient(rgba(255,255,255,.08), rgba(255,255,255,.08)); }
  .btn-primary:active { background-image: linear-gradient(rgba(255,255,255,.16), rgba(255,255,255,.16)); }
  .btn-soft:hover { background-image: linear-gradient(rgba(0,0,0,.04), rgba(0,0,0,.04)); }
  .btn-soft:active { background-image: linear-gradient(rgba(0,0,0,.08), rgba(0,0,0,.08)); }
  :focus-visible { outline: 2px solid #8a4fd8; outline-offset: 2px; }
  @keyframes mt-spin { to { transform: rotate(360deg); } }
  .mt-spin { animation: mt-spin .8s linear infinite; }
  /* 마그넷이 보드에 톡 붙는 움직임 (F1 ⑥) */
  @keyframes mt-pop { 0% { transform: translateY(-28px) scale(1.12); opacity: 0; } 60% { transform: translateY(2px) scale(.97); opacity: 1; } 100% { transform: none; } }
  .mt-pop { animation: mt-pop .55s cubic-bezier(.2,.9,.3,1.2) both; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
<!-- 라이브러리는 claude.ai 페이지에서도 열리는 CDN(cdnjs, jsdelivr)에서만 불러온다 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script type="importmap">
{
  "imports": {
    "react": "./src/vendor/react.js",
    "react-dom/client": "./src/vendor/react-dom-client.js",
    "@phosphor-icons/react": "./src/vendor/icons.js",
    "htm": "https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.module.js",
    "exifr": "https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.esm.mjs",
    "idb-keyval": "https://cdn.jsdelivr.net/npm/idb-keyval@6.2.1/dist/index.js"
  }
}
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
