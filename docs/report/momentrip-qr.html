<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모먼트립 — 휴대폰으로 열기</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f4f5; color: #18181b;
    font-family: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  .card { background: #fff; border-radius: 12px; padding: 32px; text-align: center; max-width: 360px; }
  h1 { font-size: 20px; margin: 0 0 6px; letter-spacing: -0.4px; }
  p { font-size: 14px; color: #8e8e95; margin: 0; line-height: 1.55; }
  #qr { display: inline-block; margin: 24px 0 16px; padding: 12px; background: #fff; }
  code { font-size: 12px; color: #6a3fb8; word-break: break-all; }
</style>
</head>
<body>
<div class="card">
  <h1>모먼트립 휴대폰으로 열기</h1>
  <p>휴대폰 카메라로 찍으면 열려요.<br>claude.ai에 같은 계정으로 로그인돼 있어야 해요.</p>
  <div id="qr"></div>
  <code>https://claude.ai/artifact/C9p7QqkqwCeTM4WqAvsdKg</code>
</div>
<script>
  new QRCode(document.getElementById('qr'), {
    text: 'https://claude.ai/artifact/C9p7QqkqwCeTM4WqAvsdKg',
    width: 240, height: 240, colorDark: '#18181b', colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.M,
  });
</script>
</body>
</html>
